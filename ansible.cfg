[defaults]
# inventory/ holds the static hosts file plus nodes.generated.yml written by OpenTofu
inventory = inventory
roles_path = roles:/usr/share/ansible/roles
library = library
collections_path = /usr/share/ansible/collections
host_key_checking = False
private_key_file = .state/ssh/id_ed25519
remote_user = rke
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False
local_tmp = .state/ansible/tmp
forks = 10

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
control_path_dir = .state/ansible/cp
