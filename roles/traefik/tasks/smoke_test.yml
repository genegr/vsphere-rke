---
# -e ingress_smoke_test=true: whoami behind an Ingress without ingressClassName (so it also proves the
# default IngressClass), fetched through the MetalLB address with the Host header, then cleaned up.
- name: Deploy the ingress smoke test
  kubernetes.core.k8s:
    state: present
    wait: true
    wait_timeout: 300
    definition:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ingress-smoke
          namespace: default
        spec:
          replicas: 1
          selector:
            matchLabels: { app: ingress-smoke }
          template:
            metadata:
              labels: { app: ingress-smoke }
            spec:
              containers:
                - name: whoami
                  image: "{{ ingress_smoke_image }}"
                  ports:
                    - containerPort: 80
      - apiVersion: v1
        kind: Service
        metadata:
          name: ingress-smoke
          namespace: default
        spec:
          selector: { app: ingress-smoke }
          ports:
            - port: 80
              targetPort: 80
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: ingress-smoke
          namespace: default
        spec:
          rules:
            - host: "{{ ingress_smoke_host }}"
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: ingress-smoke
                        port:
                          number: 80

- name: Fetch the smoke test page through Traefik
  ansible.builtin.uri:
    url: "http://{{ traefik_svc.resources[0].status.loadBalancer.ingress[0].ip }}/"
    headers:
      Host: "{{ ingress_smoke_host }}"
    return_content: true
  register: ingress_smoke_page
  until: ingress_smoke_page.status == 200 and 'Hostname:' in ingress_smoke_page.content
  retries: 20
  delay: 5

- name: Show the result
  ansible.builtin.debug:
    msg: "{{ ingress_smoke_page.content.splitlines() | select('match', '^(Hostname|IP|Host|X-Forwarded-For):') | list }}"

- name: Clean up the ingress smoke test
  kubernetes.core.k8s:
    state: absent
    wait: true
    definition:
      - { apiVersion: networking.k8s.io/v1, kind: Ingress, metadata: { name: ingress-smoke, namespace: default } }
      - { apiVersion: v1, kind: Service, metadata: { name: ingress-smoke, namespace: default } }
      - { apiVersion: apps/v1, kind: Deployment, metadata: { name: ingress-smoke, namespace: default } }
  when: not (ingress_smoke_keep | default(false) | bool)
