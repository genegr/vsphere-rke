---
- name: Check that the inventory still matches the VMs
  ansible.builtin.import_tasks: identity.yml

- name: Upgrade OS packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    upgrade: safe
  when: node_os_upgrade | bool

- name: Ensure base packages for RKE2 and vSphere CSI
  ansible.builtin.apt:
    name: "{{ node_packages }}"
    state: present

# multipathd would otherwise claim the VMDKs that vSphere CSI hot-adds.
- name: Keep multipathd away from local VMware disks
  ansible.builtin.copy:
    dest: /etc/multipath.conf
    mode: "0644"
    content: |
      defaults {
          user_friendly_names yes
      }
      blacklist {
          device {
              vendor "VMware"
              product "Virtual disk"
          }
      }
  notify: Restart multipathd

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot to apply kernel/library updates
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - node_reboot_if_required | bool
    - reboot_required.stat.exists

- name: Check again after the reboot (DHCP leases may have moved)
  ansible.builtin.import_tasks: identity.yml
