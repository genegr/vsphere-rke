---
# Tag-based SPBM policy consumed by the vSphere CSI StorageClass.
# Needs csi_datastore_moid / csi_datastore_list from datastores.yml (all members of a
# datastore cluster get tagged).
#
# SPBM (sps) only offers a tag category whose associable types carry the vSphere namespace
# (urn:vim25:Datastore). The tagging REST API stores what it is given and shows the types without
# the namespace either way; vmware.vmware.tag_categories only accepts the bare names, which leaves
# the category invisible to SPBM ("Unrecognized capability"). So the category is written through
# the REST API directly, with qualified types.
- name: Look up the storage tag category
  community.vmware.vmware_category_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_admin_username }}"
    password: "{{ vcenter_admin_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
  register: storage_category_info

- name: Storage tag category
  vars:
    storage_category_id: >-
      {{ storage_category_info.tag_category_info
         | selectattr('category_name', 'equalto', storage_tag_category)
         | map(attribute='category_id') | first | default('') }}
    storage_category_types: [urn:vim25:Datastore, urn:vim25:StoragePod]
  block:
    - name: Open a vCenter REST session
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/session"
        method: POST
        url_username: "{{ vcenter_admin_username }}"
        url_password: "{{ vcenter_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ vcenter_validate_certs }}"
        status_code: 201
      register: vcenter_rest_session
      no_log: true

    - name: Create the storage tag category with qualified associable types
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/cis/tagging/category"
        method: POST
        headers:
          vmware-api-session-id: "{{ vcenter_rest_session.json }}"
        body_format: json
        body:
          name: "{{ storage_tag_category }}"
          description: "Kubernetes datastore selection ({{ cluster_name }})"
          cardinality: SINGLE
          associable_types: "{{ storage_category_types }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        status_code: 201
      changed_when: true
      when: storage_category_id | length == 0

    # REST reads back the bare names, so an unqualified category (made by an older version of this
    # role, or by hand through the API) can't be detected; re-setting the types is a server-side
    # no-op once they are qualified, hence changed_when: false.
    - name: Qualify the associable types of the existing storage tag category
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/cis/tagging/category/{{ storage_category_id }}"
        method: PATCH
        headers:
          vmware-api-session-id: "{{ vcenter_rest_session.json }}"
        body_format: json
        body:
          associable_types: "{{ storage_category_types }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        status_code: 204
      changed_when: false
      when: storage_category_id | length > 0
  always:
    - name: Close the vCenter REST session
      ansible.builtin.uri:
        url: "https://{{ vcenter_hostname }}/api/session"
        method: DELETE
        headers:
          vmware-api-session-id: "{{ vcenter_rest_session.json }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        status_code: 204
      when: vcenter_rest_session.json is defined
      no_log: true

- name: Ensure the storage tag exists
  vmware.vmware.tags:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_admin_username }}"
    password: "{{ vcenter_admin_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    state: present
    tags:
      - name: "{{ storage_tag_name }}"
        category_name: "{{ storage_tag_category }}"
        description: "Datastores for {{ cluster_name }} CSI volumes"

- name: Tag the CSI datastore(s)
  vmware.vmware.tag_associations:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_admin_username }}"
    password: "{{ vcenter_admin_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    state: present
    object_name: "{{ item }}"
    object_type: Datastore
    tags:
      - name: "{{ storage_tag_name }}"
        category_name: "{{ storage_tag_category }}"
  loop: "{{ csi_datastore_list }}"

- name: Tag the datastore cluster object itself
  vmware.vmware.tag_associations:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_admin_username }}"
    password: "{{ vcenter_admin_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    state: present
    object_moid: "{{ csi_datastore_moid }}"
    object_type: DatastoreCluster
    tags:
      - name: "{{ storage_tag_name }}"
        category_name: "{{ storage_tag_category }}"
  when: csi_datastore_moid.startswith('group-p')

# With qualified associable types SPBM knows the category within seconds; the short retry
# only covers the tagging -> sps replication.
- name: Storage policy
  block:
    - name: Ensure the tag-based storage policy exists
      community.vmware.vmware_vm_storage_policy:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_admin_username }}"
        password: "{{ vcenter_admin_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        name: "{{ storage_policy_name }}"
        description: "{{ cluster_name }} CSI volumes (tag {{ storage_tag_category }}:{{ storage_tag_name }})"
        tag_category: "{{ storage_tag_category }}"
        tag_name: "{{ storage_tag_name }}"
        tag_affinity: true
        state: present
      register: storage_policy_result
      until: storage_policy_result is succeeded
      retries: 3
      delay: 10
  rescue:
    - name: Explain an unknown tag category
      ansible.builtin.fail:
        msg: >-
          SPBM does not recognise tag category '{{ storage_tag_category }}'. Its associable types must be
          stored as urn:vim25:Datastore / urn:vim25:StoragePod (see the skill: SPBM probe and
          'Storage policy "Unrecognized capability"').
      when: "'Unrecognized capability' in (ansible_failed_result.msg | default(''))"

    - name: Fail on any other storage policy error
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default(ansible_failed_result) }}"
