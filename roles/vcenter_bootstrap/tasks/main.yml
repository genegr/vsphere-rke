---
- name: SSO service accounts
  ansible.builtin.import_tasks: users.yml
  tags: [users]

- name: Roles
  ansible.builtin.import_tasks: roles.yml
  tags: [roles]

- name: VM folder
  ansible.builtin.import_tasks: folder.yml
  tags: [folder]

# Cheap lookup needed by both storage_policy and permissions: always run it, so
# neither --tags nor --skip-tags can leave csi_datastore_list unresolved.
- name: CSI datastore(s)
  ansible.builtin.import_tasks: datastores.yml
  tags: [always]

- name: Storage policy
  ansible.builtin.import_tasks: storage_policy.yml
  tags: [storage_policy]

- name: Permissions
  ansible.builtin.import_tasks: permissions.yml
  tags: [permissions]

- name: Ubuntu template
  ansible.builtin.import_tasks: template.yml
  tags: [template]
