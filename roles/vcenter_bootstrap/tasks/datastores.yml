---
# csi_datastore may be a single datastore or a datastore cluster: resolve it to the list of
# member datastores (used for tagging and for the CSI account's datastore permissions).
- name: Resolve the CSI datastore MoID (datastore vs datastore cluster)
  ansible.builtin.set_fact:
    csi_datastore_moid: >-
      {{ lookup('vmware.vmware.moid_from_path',
                '/' ~ vsphere_datacenter ~ '/datastore/' ~ csi_datastore,
                **vcenter_admin_lookup_args) }}

- name: Gather datastore membership (datastore cluster only)
  community.vmware.vmware_datastore_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_admin_username }}"
    password: "{{ vcenter_admin_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter_name: "{{ vsphere_datacenter }}"
  register: datastore_info
  when: csi_datastore_moid.startswith('group-p')

- name: Build the list of CSI datastores
  ansible.builtin.set_fact:
    csi_datastore_list: >-
      {{ [csi_datastore] if not csi_datastore_moid.startswith('group-p')
         else datastore_info.datastores
              | selectattr('datastore_cluster', 'defined')
              | selectattr('datastore_cluster', 'equalto', csi_datastore)
              | map(attribute='name') | list }}
