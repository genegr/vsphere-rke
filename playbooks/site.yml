---
# Full deployment: vCenter bootstrap -> node VMs -> RKE2 -> vSphere CPI/CSI -> MetalLB/Traefik.
- name: Stage 1 - vCenter bootstrap
  ansible.builtin.import_playbook: 01-vcenter-bootstrap.yml

- name: Stage 2 - node VMs (OpenTofu)
  ansible.builtin.import_playbook: 02-nodes.yml

- name: Stage 3 - RKE2
  ansible.builtin.import_playbook: 03-rke2.yml

- name: Stage 4 - vSphere CPI/CSI
  ansible.builtin.import_playbook: 04-vsphere-csi.yml

- name: Stage 5 - MetalLB + Traefik
  ansible.builtin.import_playbook: 05-ingress.yml
