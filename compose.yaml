# Run every tool through this service, e.g.:
#   docker compose run --rm toolbox ansible-playbook playbooks/site.yml
services:
  toolbox:
    build:
      context: docker
      # Lab DNS (172.17.0.53) overlaps Docker's default bridge 172.17.0.0/16:
      # bridged containers cannot resolve names, so build and run on the host network.
      network: host
    image: vsphere-rke-toolbox:1
    network_mode: host
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      HOME: /work/.state/home
      ANSIBLE_CONFIG: /work/ansible.cfg
      ANSIBLE_ROLES_PATH: /work/roles:/usr/share/ansible/roles
      KUBECONFIG: /work/.state/kubeconfig
      TF_IN_AUTOMATION: "1"
    stdin_open: true
    tty: true
