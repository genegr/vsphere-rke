---
# Static part of the inventory. Node hosts are added to rke2_servers / rke2_agents
# by OpenTofu in inventory/nodes.generated.yml (playbooks/02-nodes.yml).
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    k8s_cluster:
      children:
        rke2_servers:
        rke2_agents:
